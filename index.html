<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sogwon CHOE - Profile</title>
    <style>
        /* 기본 설정 */
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
            --text-light: #888888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            line-height: 1.6;
        }

        .container {
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }

        /* 이름 섹션 */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        /* 성(Last Name) 스타일링: Small Caps 적용 */
        .surname {
            font-variant: small-caps; 
            /* 영문 소문자를 입력해도 작은 대문자로 표시됩니다 */
        }

        /* 직함 및 회사 */
        .title {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 400;
            margin: 0;
        }

        .company {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 2.5rem 0;
            color: var(--text-main);
        }

        /* QR 코드 영역 */
        .qr-wrapper {
            margin: 2rem 0;
        }
        
        .qr-code {
            width: 150px;
            height: 150px;
            /* QR코드 이미지 렌더링 선명하게 */
            image-rendering: pixelated; 
        }

        /* 하단 링크 섹션 */
        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-light);
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }

        .footer p {
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.7rem;
        }

        .footer a {
            color: var(--text-light);
            text-decoration: none;
            word-break: break-all; /* 긴 URL 줄바꿈 처리 */
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--text-main);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Sogwon <span class="surname">Choe</span></h1>
        
        <p class="title">CEO & Head of Technology</p>
        <p class="company">Com2uS Platform</p>

        <div class="qr-wrapper">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://kr.linkedin.com/in/sogwon&color=000000&bgcolor=ffffff" 
                 alt="LinkedIn QR Code" 
                 class="qr-code">
        </div>

        <div class="footer">
            <p>Private homepage</p>
            <a href="https://sites.google.com/com2us.com/pumila-home/" target="_blank">
                https://sites.google.com/com2us.com/pumila-home/
            </a>
        </div>
    </main>

</body>
</html>
